services:
  app:
    image: ghcr.io/lightningspell/spacetraderio:latest
    #restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://spacetrader:${DB_PASSWORD}@db:5432/spacetrader
    env_file:
      - .env

  db:
    image: postgres:16
    #restart: unless-stopped
    environment:
      POSTGRES_USER: spacetrader
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spacetrader
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  airflow-init:
    image: apache/airflow:2.10.4
    depends_on:
      - db
    user: "${AIRFLOW_UID}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Benedikt --lastname Richter --role Admin --email admin@example.com

  airflow-webserver:
    image: apache/airflow:2.10.4
    restart: unless-stopped
    user: "${AIRFLOW_UID}:0"
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.4
    restart: unless-stopped
    user: "${AIRFLOW_UID}:0"
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: scheduler

volumes:
  pgdata:
